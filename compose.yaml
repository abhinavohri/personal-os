services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pagecraft
      POSTGRES_USER: pagecraft
      POSTGRES_PASSWORD: pagecraft
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagecraft -d pagecraft"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pagecraft:pagecraft@db:5432/pagecraft
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  web_node_modules:
