[project]
name = "personal-os"
version = "0.1.0"
description = "Personal planning and memory orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1.50,<2",
  "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
